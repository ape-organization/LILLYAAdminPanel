<div class="admin-page">

  <!-- HEADER -->
  <header class="page-header">

    <div class="header-content">

      <span class="header-icon">
        <mat-icon>category</mat-icon>
      </span>

      <div>

        <h1>
          {{ 'categories.management' | translate }}

          <span class="header-count">
            {{ categories().length }}
          </span>
        </h1>

        <p>{{ 'categories.description' | translate }}</p>

      </div>

    </div>

    <button
      mat-raised-button
      class="primary-btn"
      type="button"
      (click)="showAddCategory()">

      <mat-icon>add</mat-icon>

      {{ 'categories.addCategory' | translate }}

    </button>

  </header>


  <!-- GRID -->
  <div class="card-grid">

    @for (category of paginatedCategories(); track category.id) {

      <article class="grid-card">

        <div class="card-media">

          @if (category.imageUrl) {

            <img
              [src]="getImageUrl(category.imageUrl)"
              [alt]="category.nameEn"
              loading="lazy">

          } @else {

            <mat-icon>category</mat-icon>

          }

        </div>


        <div class="card-body">

          <div class="card-names">

            <div class="name-line">
             <!--  <span class="lang-tag">EN</span> -->
              <strong>{{ category.nameEn }}</strong>
            </div>

            <div class="name-line" >
             <!--  <span class="lang-tag">ع</span> -->
              <strong>{{ category.nameAr }}</strong>
            </div>

          </div>


          <div class="row-actions">

            <button
              type="button"
              class="icon-btn edit"
              [attr.aria-label]="'categories.editCategory' | translate"
              (click)="editCategory(category)">

              <mat-icon>edit</mat-icon>

            </button>

            <button
              type="button"
              class="icon-btn delete"
              [attr.aria-label]="'common.delete' | translate"
              (click)="deleteCategory(category.id)">

              <mat-icon>delete</mat-icon>

            </button>

          </div>

        </div>

      </article>

    }

  </div>


  <!-- PAGINATION -->
  <div class="list-footer">

    <mat-paginator
      [length]="categories().length"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>

  </div>

</div>
